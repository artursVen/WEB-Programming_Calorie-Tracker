<!DOCTYPE html>
<html lang="lv">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>
            {% block title %}
                Kaloriju skaitītājs
            {% endblock %}
        </title>
    </head>

    <body>
        <header>
            <h1>Kaloriju skaitītājs</h1>

            {% if user.is_authenticated %}
                <div>
                    <span>
                        Lietotājs: {{ user.username}}
                    </span>

                    <form
                        method="post"
                        action="{% url 'logout' %}"
                    >
                        {% csrf_token %}

                        <button type="submit">
                            Izrakstīties
                        </button>
                    </form>
                </div>
            {% endif %}
        </header>

        <main>
            {% block content %}
            {% endblock %}
        </main>

        <footer>
            <p>
                WADT laboratorijas darbs Nr. 2
            </p>
        </footer>

        {% block extra_js %}
        {% endblock %}
    </body>
</html>
